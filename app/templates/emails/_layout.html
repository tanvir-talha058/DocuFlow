<!--
Email-safe layout: table-based, inline-styled, no external CSS or webfonts
(Outlook's Word rendering engine ignores both). Font fallbacks lean on
Segoe UI / Consolas deliberately — they're what Outlook itself renders in,
so the mail looks native to the inbox it lands in rather than bolted on.
-->
<span style="display:none;max-height:0;overflow:hidden;opacity:0;">{% block preheader %}{% endblock %}</span>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f6f7f9;padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="560" cellpadding="0" cellspacing="0" border="0" style="max-width:560px;width:100%;background-color:#ffffff;border:1px solid #e7e9ef;">
        <tr>
          <td style="background-color:#2b3a66;padding:14px 28px;font-family:'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;color:#ffffff;">
            &#9678;&nbsp; DocuFlow
          </td>
        </tr>
        <tr>
          <td style="padding:28px 28px 8px 28px;">
            {% block badge %}{% endblock %}
            <h1 style="margin:0 0 14px 0;font-family:Georgia,'Times New Roman',serif;font-weight:600;font-size:21px;line-height:1.3;color:#161a2b;">{% block heading %}{% endblock %}</h1>
            <div style="font-family:'Segoe UI',Arial,sans-serif;font-size:14px;line-height:1.6;color:#5a6072;">
              {% block body %}{% endblock %}
            </div>
          </td>
        </tr>
        {% block cta %}{% endblock %}
        <tr>
          <td style="padding:20px 28px 24px 28px;border-top:1px dashed #e7e9ef;margin-top:8px;">
            <div style="font-family:Consolas,'Courier New',monospace;font-size:12px;color:#9096a6;">{% block footer %}{% endblock %}</div>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
